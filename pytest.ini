[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    error::DeprecationWarning:edgetrack.*
markers =
    slow: takes more than a couple of seconds
    needs_model: needs the exported detector (scripts/export_onnx.py)
    needs_dataset: needs the generated dataset (scripts/make_dataset.py)
    needs_ros: needs a sourced ROS2 installation

# `docker compose -f docker/docker-compose.yml up` runs the demo end to end:
# generates a scene, detects, tracks, scores against ground truth and writes an
# annotated video into ./results.
#
# The model is the one thing it cannot generate.  The `fetch` service pulls the
# published weights from the GitHub Release before the demo starts, so a clean
# machine with docker and a network connection needs no other step.

name: edgetrack

services:
  # Weights land in /app/weights rather than /app/models: the image carries
  # models/MANIFEST.json and a bind mount over /app/models would hide it, so
  # the fetch would fail looking for the manifest it was about to use.
  fetch:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    environment:
      # Needed only while the repository is private.  Unset is fine on a public
      # one and docker compose passes an empty value through harmlessly.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ../models:/app/weights
    command: >
      python scripts/fetch_model.py
        --out /app/weights
        --only yolov8n_edgetrack_fp32.onnx reid_edgetrack.onnx

  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    depends_on:
      fetch:
        condition: service_completed_successfully
    volumes:
      - ../models:/app/weights:ro
      - ../results:/app/results
    command: >
      python scripts/run_demo.py
        --source synth:7
        --model /app/weights/yolov8n_edgetrack_fp32.onnx
        --tracker bytetrack
        --video /app/results/demo.mp4
        --out /app/results/demo.json

# Detector.  YOLOX-Tiny, Apache-2.0 code and weights, because the target is a
# Jetson Orin Nano and the deployment has to be usable commercially.  Tiny is
# the size class nearest the YOLOv8n it replaced (5.0 million parameters
# against 3.0 million); Nano is depthwise and gives up too much accuracy, S is
# three times the compute.  docs/licences.md says why YOLOX rather than RTMDet
# or D-FINE.

architecture: yolox_tiny
pretrained: yolox_tiny.pth    # Megvii's COCO weights, fine-tuned from here
num_classes: 4

# Training and inference both run at the native aspect.
train_imgsz: [640, 384]       # width, height
infer_imgsz: [640, 384]       # width, height

nms:
  conf_threshold: 0.25
  iou_threshold: 0.6
  max_detections: 100
  class_agnostic: false
